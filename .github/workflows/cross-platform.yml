name: Cross-platform System Checker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run system checker
        run: python system_checker.py

      - name: Validate JSON output
        shell: bash
        run: |
          python -c 'import json; from pathlib import Path; data = json.loads(Path("system_info.json").read_text(encoding="utf-8")); required = ["operating_system", "computer", "architecture", "cpu", "logical_cpus", "ram_gb", "disk_total_gb", "disk_used_gb", "disk_free_gb", "local_ip", "ping_return_code", "internet_available"]; missing = [key for key in required if key not in data]; assert not missing, f"Missing JSON fields: {missing}"; print("JSON validation OK")'
